name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint & Unit Test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://dummy_user:dummy_password@localhost:5432/dummy_db?sslmode=disable"
      NEXTAUTH_SECRET: "dummy-nextauth-secret-for-ci-pipeline-only"
      NEXTAUTH_URL: "http://localhost:3000"
      NVIDIA_API_KEY: "dummy-nvidia-api-key"
      NODE_ENV: "test"
      npm_config_legacy_peer_deps: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint -- --rule "@typescript-eslint/no-explicit-any: warn" --rule "react-hooks/set-state-in-effect: warn" --rule "react-hooks/purity: warn"
        continue-on-error: true

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      - name: Run unit tests (Vitest)
        run: npm run test:run

      - name: Build Next.js application
        run: npm run build
